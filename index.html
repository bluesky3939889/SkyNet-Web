<!doctype html>
<html lang="zh-Hant"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src https://*.supabase.co; img-src 'self' data: blob:; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="theme-color" content="#101820"><title>SkyNet</title>
<link rel="icon" type="image/png" href="skynet-icon.png">
<link rel="stylesheet" href="style.css?v=radar-map-toolbar"><script src="config.js?v=7.0.0" defer></script><script src="board.js?v=radar-compact" defer></script><script src="radar.js?v=radar-map-toolbar" defer></script>
</head><body><main>
<header><img src="skynet-icon.png" alt="" width="40" height="40"><h1>SkyNet</h1><button id="logout" class="secondary" hidden>登出</button></header>
<p id="status" role="status" aria-live="polite">正在載入登入程式；若長時間停留，請重新整理網頁。</p>
<noscript>此看板需要 JavaScript，請使用已啟用 JavaScript 的瀏覽器。</noscript>
<section id="auth" class="card"><h2>登入私人看板</h2>
<form id="login-form" novalidate><details id="project-settings"><summary>連線設定</summary>
<label for="url">Supabase Project URL</label><input id="url" type="url" placeholder="https://專案代碼.supabase.co" autocomplete="off" required>
<label for="key">Publishable／anon key</label><input id="key" autocomplete="off" autocapitalize="none" spellcheck="false" required></details>
<label for="email">Email</label><input id="email" type="email" autocomplete="username" required>
<label for="password">密碼</label><input id="password" type="password" autocomplete="current-password" required>
<label class="remember" for="remember"><input id="remember" type="checkbox"><span>在此裝置保持登入</span></label>
<p class="hint">使用管理者建立的完整 Email 與密碼。核准成員可查看共享雷達。</p><button id="login" type="submit">登入看板</button></form></section>
<section id="password-change" class="card" hidden>
<h2>首次登入須更換密碼</h2>
<form id="password-change-form">
<label for="new-password">新密碼（至少 12 個字元）</label><input id="new-password" type="password" autocomplete="new-password" minlength="12" required>
<label for="confirm-password">再輸入一次新密碼</label><input id="confirm-password" type="password" autocomplete="new-password" required>
<button id="save-password" type="submit">更換密碼</button>
</form></section>
<section id="radar-feed" hidden>
<div class="toolbar"><h2 id="radar-heading">雷達回報</h2><button id="radar-refresh" class="secondary" type="button">立即更新</button></div>
<nav id="radar-modes" class="board-tabs" aria-label="雷達功能"></nav>
<details><summary>排列功能順序</summary><div id="radar-mode-order"></div></details>
<div id="radar-groups" class="board-tabs" role="group" aria-label="血盟群組" hidden></div>
<details><summary>管理血盟群組</summary>
<form id="radar-group-form">
<label for="radar-group-name">群組名稱</label><input id="radar-group-name" maxlength="128" required>
<label for="radar-group-clans">血盟名稱（逗號分隔）</label><input id="radar-group-clans" placeholder="血盟名稱,血盟名稱2,血盟名稱3">
<div class="map-actions"><button type="submit">儲存群組</button><button id="radar-group-delete" type="button">移除群組</button></div>
<p id="radar-group-status" role="status"></p>
</form></details>
<details><summary>篩選細項</summary>
<div class="filters"><label for="radar-region">分區</label><select id="radar-region"><option value="">全部分區</option></select>
<label id="radar-kind-label" for="radar-kind">類型</label><select id="radar-kind"><option value="">全部類型</option><option value="report">一般回報</option><option value="boss">BOSS</option><option value="banner">橫幅推估</option></select>
<label for="radar-clan">血盟</label><select id="radar-clan"><option value="">全部血盟</option></select>
<label for="radar-server">伺服器</label><select id="radar-server"><option value="">全部伺服器</option></select>
<label for="radar-map-filter">地圖</label><select id="radar-map-filter"><option value="">全部地圖</option></select>
<label for="radar-search">搜尋名稱</label><input id="radar-search" type="search" placeholder="角色或 BOSS 名稱"></div>
</details>
<p id="radar-status" class="hint" role="status"></p>
<p class="radar-age-legend"><span data-age="1">1 分內</span><span data-age="5">1～5 分</span><span data-age="10">5～10 分</span><span data-age="30">10～30 分</span><span data-age="60">30～60 分</span></p>
<section id="radar-map" class="card" hidden>
<div class="toolbar"><h2 id="radar-map-title">地圖</h2><button id="radar-map-close" class="secondary" type="button">關閉地圖</button></div>
<p id="radar-map-detail" class="hint" role="status"></p>
<div class="map-actions radar-map-toolbar">
<div id="radar-map-picker" hidden>
<details id="radar-map-menu"><summary>選擇地圖</summary>
<label for="radar-map-search">搜尋地圖</label><input id="radar-map-search" type="search" placeholder="輸入地圖名稱">
<select id="radar-map-choice" size="6" aria-label="搜尋結果"></select>
</details>
<details id="radar-map-favorite-menu"><summary>★ 最愛地圖</summary>
<select id="radar-map-favorites" size="5" aria-label="最愛地圖"></select>
<button id="radar-map-favorite" type="button">加入最愛</button>
</details>
</div>
<button id="radar-zoom-out" type="button" aria-label="縮小">−</button><button id="radar-zoom-in" type="button" aria-label="放大">＋</button><button id="radar-center" type="button">回到標記</button>
<div id="radar-map-controls" hidden>
<button id="radar-map-fit" type="button">符合視窗</button>
<label><input id="radar-map-names" type="checkbox" checked> 顯示名字</label>
<label><input id="radar-map-follow" type="checkbox" checked> 跟著篩選結果切換地圖</label>
</div>
<button id="radar-select" type="button" aria-pressed="false">框選回報</button><button id="radar-clear-area" type="button">清除框選</button>
</div>
<p id="radar-area-status" class="hint" role="status"></p>
<div id="radar-map-scroll" tabindex="0" aria-label="地圖，可捲動"><canvas id="radar-canvas" aria-label="地圖上的回報位置"></canvas></div>
</section>
<details><summary>顯示欄位</summary><div id="radar-columns"></div></details>
<p id="radar-empty" hidden>沒有符合篩選條件的回報。</p>
<div class="radar-table-scroll" tabindex="0" aria-label="雷達回報表格">
<table class="radar-table" aria-label="共享雷達回報"><thead><tr id="radar-head"></tr></thead><tbody id="radar-rows"></tbody></table>
</div>
</section>
<footer>SkyNet 7.0.0 · Supabase 私人看板</footer>
</main></body></html>
